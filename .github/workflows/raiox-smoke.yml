name: RAIO X Mobile Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'gestao-rafael.js'
      - 'month-live.js'
      - 'mobile-*.css'
      - 'tests/**'
      - '.github/workflows/raiox-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all tabs on Android sizes and desktop
        run: node tests/raiox-smoke.cjs
      - name: Save visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raiox-mobile-screenshots
          path: qa-*.png
          if-no-files-found: ignore
